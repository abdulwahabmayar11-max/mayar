<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وب‌سایت شخصی من</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            text-align: center;
            padding: 30px 10px;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #764ba2;
        }
        .about-section {
            background: #f1f3f9;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 15px;
            line-height: 1.6;
        }
        .social-buttons {
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .instagram { background-color: #e1306c; }
        .telegram { background-color: #0088cc; }
        .whatsapp { background-color: #25d366; }
        .btn:hover { opacity: 0.9; }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>به وب‌سایت من خوش آمدید!</h1>
        
        <!-- بخش درباره من -->
        <div class="about-section">
            <h3>درباره من</h3>
            <p>سلام! من عبدالوهاب هستم. این وب‌سایت شخصی من است که در آن فعالیت‌ها، علایق و نمونه‌کارهایم را به اشتراک می‌گذارم.</p>
        </div>

        <!-- گالری تصاویر -->
        <h3>گالری تصاویر</h3>
        <div class="gallery">
            <img src="https://picsum.photos" alt="تصویر ۱">
            <img src="https://picsum.photos" alt="تصویر ۲">
        </div>

        <!-- شبکه‌های اجتماعی -->
        <h3>ارتباط با من</h3>
        <div class="social-buttons">
            <a href="https://instagram.com" target="_blank" class="btn instagram">اینستاگرام</a>
            <a href="https://t.me" target="_blank" class="btn telegram">تلگرام</a>
            <a href="https://wa.me" target="_blank" class="btn whatsapp">واتس‌اپ</a>
        </div>
    </div>

</body>
</html>
