<!DOCTYPE html>
<html>
<head>
<title>Mayar Social</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f0f2f5;
}

.header{
background:#1877f2;
color:white;
padding:15px;
font-size:22px;
font-weight:bold;
text-align:center;
}

.post{
background:white;
width:500px;
margin:20px auto;
padding:15px;
border-radius:10px;
}

img{
width:100%;
border-radius:0px;
}

button{
padding:8px;
margin:5px;
border:none;
cursor:pointer;
}

.info{
background:white;
width:500px;
margin:20px auto;
padding:15px;
border-radius:10px;
}
</style>

</head>

<body>

<div class="header">
Mayar Social App
</div>

<!-- LOGIN (simple demo) -->
<div class="info">
<h3>Login</h3>
<input placeholder="Username"><br><br>
<input placeholder="Password" type="password"><br><br>
<button>Login</button>
</div>

<!-- PROFILE INFO -->
<div class="info">
<h3>Abdulwahab Mayar</h3>
<p>WhatsApp: 07XXXXXXXX</p>
<p>Telegram: @username</p>
<p>Instagram: @username</p>
<p>Facebook: Abdulwahab Mayar</p>
</div>

<!-- POST -->
<div class="post">
<h3>My Post</h3>

<img src="https://picsum.photos/600/400">

<p>Hello friends 👋</p>

<button onclick="like()">👍 Like <span id="like">10</span></button>
<button>💬 Comment</button>
</div>

<script>
let l = 10;
function like(){
l++;
document.getElementById("like").innerText = l;
}
</script>

</body>
</html>
